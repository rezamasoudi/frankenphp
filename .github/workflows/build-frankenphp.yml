name: Build FrankenPHP (PHP 8.3) & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PHP_VERSION: "8.3"

jobs:
  build:
    name: Build static binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            goarch: amd64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison re2c pkg-config \
            ca-certificates curl git xz-utils bzip2 unzip zip ninja-build \
            libxml2-dev libsqlite3-dev libcurl4-openssl-dev libonig-dev \
            libssl-dev zlib1g-dev libzip-dev libreadline-dev libbrotli-dev \
            libicu-dev libbz2-dev libpng-dev libjpeg-dev libfreetype6-dev \
            libwebp-dev libxpm-dev libmagickwand-dev libmagickcore-dev \
            libpq-dev libyaml-dev libedit-dev musl-tools
          # Go
          wget -q "https://go.dev/dl/go1.22.5.linux-${{ matrix.goarch }}.tar.gz" -O /tmp/go.tgz
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      # ---------- static-php-cli (باینری آماده، بدون composer) ----------
      - name: Setup static-php-cli
        id: spc
        run: |
          if [ "${{ matrix.target }}" = "linux-x86_64" ]; then
            SPC_ARCH="x86_64"
          else
            SPC_ARCH="aarch64"
          fi
          curl -fsSL -o /usr/local/bin/spc \
            "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-linux-${SPC_ARCH}"
          chmod +x /usr/local/bin/spc
          /usr/local/bin/spc --version
          echo "bin=/usr/local/bin/spc" >> $GITHUB_OUTPUT

      # ---------- دانلود و بیلد PHP ----------
      - name: Download sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spc doctor --auto-fix || true
          spc download --with-php=${PHP_VERSION} --for-extensions \
            "apcu,bcmath,bz2,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,gd,gmp,iconv,igbinary,imagick,intl,ldap,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pgsql,phar,posix,readline,redis,session,shmop,soap,sockets,sodium,sysvmsg,sysvsem,sysvshm,tidy,tokenizer,xml,xmlreader,xmlwriter,zip,zlib,zstd" \
            --prefer-pre-built

      - name: Build PHP + FrankenPHP (${{ env.PHP_VERSION }})
              run: |
                spc build --build-cli --build-frankenphp \
                  "apcu,bcmath,bz2,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,gd,gmp,iconv,igbinary,imagick,intl,ldap,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pgsql,phar,posix,readline,redis,session,shmop,soap,sockets,sodium,sysvmsg,sysvsem,sysvshm,tidy,tokenizer,xml,xmlreader,xmlwriter,zip,zlib,zstd"
                ls -lh buildroot/bin/
                cp buildroot/bin/frankenphp "frankenphp-${{ matrix.target }}"
                cp buildroot/bin/php "php-${{ matrix.target }}" || true

      - name: Smoke test
        run: |
          ./${{ matrix.target }} php -v
          ./${{ matrix.target }} php -m
          ./${{ matrix.target }} php -r 'var_dump(extension_loaded("redis"), extension_loaded("pdo_mysql"), extension_loaded("intl"));'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frankenphp-${{ matrix.target }}
          path: frankenphp-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create install script
        run: |
          cat > install.sh <<'EOF'
          #!/bin/sh
          set -e
          REPO="${FRANKENPHP_REPO:-$GITHUB_REPOSITORY}"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in x86_64) ARCH=x86_64;; aarch64|arm64) ARCH=aarch64;; esac
          TAG="${1:-latest}"
          if [ "$TAG" = "latest" ]; then
            URL="https://github.com/$REPO/releases/latest/download/frankenphp-$OS-$ARCH"
          else
            URL="https://github.com/$REPO/releases/download/$TAG/frankenphp-$OS-$ARCH"
          fi
          curl -fsSL "$URL" -o /usr/local/bin/frankenphp
          chmod +x /usr/local/bin/frankenphp
          echo "frankenphp installed -> $(frankenphp version)"
          EOF
          chmod +x install.sh

      - name: Compress binaries
        run: |
          cd dist
          for f in frankenphp-*; do
            tar -czf "$f.tar.gz" "$f"
            sha256sum "$f" "$f.tar.gz" >> checksums.txt
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            install.sh
          body: |
            ## FrankenPHP (PHP 8.3, static — Linux)

            باینری استاتیک FrankenPHP با PHP 8.3 و اکستنشن‌های کامل لاراول:
            `redis, pdo_mysql, pdo_pgsql, pdo_sqlite, mysqli, gd, imagick, intl, mbstring, zip, bcmath, opcache, pcntl, soap, sockets, sodium, gmp, ldap, apcu, igbinary, zstd, bz2, curl, openssl`

            ### نصب با یک خط:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            ### نصب نسخه‌ی مشخص:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh -s -- v1.0.0
            ```

            ### اجرای پروژه لاراول:
            ```bash
            cd /path/to/laravel
            frankenphp php-server
            ```

            ### checksums
            فایل `checksums.txt` کنار باینری‌ها موجود است.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}